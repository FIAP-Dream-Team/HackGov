server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

hackgov:
  seed: true

spring:
  application:
    name: hackgov-backend
  datasource:
    url: jdbc:h2:mem:hackgov
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
